<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charity: Water's Water Drop Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="top-left-container">
        <img src="img/can2.png" alt="Can 2" class="top-left-can">
        <span class="top-left-text">Charity: Water</span>
    </div>
    <div class="game-wrapper">
        <h1 class="game-title">Water Drop</h1>
        <p class="game-tagline">Catch the good drops, avoid the bad ones!</p>
        <div class="score-panel">
            <button id="start-btn">Start Game</button>
            <button id="reset-btn">Reset</button>
            <div class="score">Score: <span id="score">0</span></div>
        </div>
        
        <div id="game-container">
            <div id="message-display"></div>
            <div class="water-can-container">
                <img src="img/jug.png" alt="Jug" class="water-can">
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
